<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রিয়েলটাইম চ্যাট</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body { background:#0f172a; color:#fff; height:100vh; display:flex; flex-direction:column; }
  #loginScreen { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; }
  #loginScreen h1 { font-size:28px; margin-bottom:10px; }
  #loginScreen p { color:#94a3b8; margin-bottom:25px; }
  #usernameInput { width:100%; max-width:350px; padding:14px; border-radius:10px; border:none; font-size:16px; margin-bottom:15px; }
  #joinBtn { width:100%; max-width:350px; padding:14px; border:none; border-radius:10px; background:#22c55e; color:#fff; font-size:16px; font-weight:bold; cursor:pointer; }
  #chatScreen { display:none; flex:1; flex-direction:column; height:100vh; }
  #chatHeader { padding:15px; background:#1e293b; display:flex; justify-content:space-between; align-items:center; }
  #chatBody { flex:1; display:flex; overflow:hidden; }
  #messages { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { background:#1e293b; padding:10px 14px; border-radius:12px; max-width:80%; }
  .msg b { color:#22c55e; font-size:13px; }
  .msg span { font-size:11px; color:#94a3b8; margin-left:8px; }
  .msg div { margin-top:3px; }
  .system { text-align:center; color:#94a3b8; font-size:13px; }
  #userList { width:150px; background:#1e293b; padding:15px; overflow-y:auto; }
  #userList h3 { font-size:14px; margin-bottom:10px; color:#94a3b8; }
  #userList div { font-size:14px; margin-bottom:8px; }
  #messageForm { display:flex; padding:10px; gap:10px; background:#1e293b; }
  #messageInput { flex:1; padding:12px; border-radius:10px; border:none; font-size:15px; }
  #sendBtn { padding:12px 20px; border:none; border-radius:10px; background:#22c55e; color:#fff; font-weight:bold; cursor:pointer; }
  @media(max-width:600px){ #userList{ display:none; } }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>💬 রিয়েলটাইম চ্যাট</h1>
  <p>নাম লিখে চ্যাটে প্রবেশ করো</p>
  <input id="usernameInput" placeholder="তোমার নাম লেখো" maxlength="20">
  <button id="joinBtn">প্রবেশ করো</button>
</div>

<div id="chatScreen">
  <div id="chatHeader"><span>চ্যাট রুম</span><span id="onlineCount">অনলাইন: ০</span></div>
  <div id="chatBody">
    <div id="messages"></div>
    <div id="userList"><h3>অনলাইন</h3><div id="users"></div></div>
  </div>
  <form id="messageForm">
    <input id="messageInput" placeholder="মেসেজ লেখো..." autocomplete="off">
    <button id="sendBtn" type="submit">পাঠাও</button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
var socket = io('https://realtime-chat-ujw.onrender.com');
var myName = '';

document.getElementById('joinBtn').onclick = function() {
  var name = document.getElementById('usernameInput').value.trim();
  if (!name) { alert('নাম লেখো'); return; }
  myName = name;
  socket.emit('join', name);
  document.getElementById('loginScreen').style.display = 'none';
  var cs = document.getElementById('chatScreen');
  cs.style.display = 'flex';
  document.getElementById('messageInput').focus();
};

document.getElementById('messageForm').onsubmit = function(e) {
  e.preventDefault();
  var input = document.getElementById('messageInput');
  var text = input.value.trim();
  if (!text) return;
  socket.emit('chatMessage', text);
  input.value = '';
  input.focus();
};

function addMessage(data) {
  var box = document.getElementById('messages');
  if (typeof data === 'string') {
    var d = document.createElement('div');
    d.className = 'system';
    d.textContent = data;
    box.appendChild(d);
  } else {
    var m = document.createElement('div');
    m.className = 'msg';
    var name = data.username || 'Anonymous';
    var text = data.text || data.message || '';
    var time = data.time || '';
    m.innerHTML = '<b></b><span></span><div></div>';
    m.querySelector('b').textContent = name;
    m.querySelector('span').textContent = time;
    m.querySelector('div').textContent = text;
    box.appendChild(m);
  }
  box.scrollTop = box.scrollHeight;
}

socket.on('chatMessage', addMessage);
socket.on('system message', addMessage);
socket.on('chat history', function(list) {
  document.getElementById('messages').innerHTML = '';
  list.forEach(addMessage);
});
socket.on('userList', function(list) {
  var u = document.getElementById('users');
  u.innerHTML = '';
  list.forEach(function(name) {
    var d = document.createElement('div');
    d.textContent = '🟢 ' + name;
    u.appendChild(d);
  });
  document.getElementById('onlineCount').textContent = 'অনলাইন: ' + list.length;
});
</script>
</body>
</html>
