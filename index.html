<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রিয়েলটাইম চ্যাট</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>চ্যাট রুমে প্রবেশ করো</h1>
      <input type="text" id="username-input" placeholder="তোমার নাম লিখো..." maxlength="20" autocomplete="off" />
      <button id="join-btn">প্রবেশ করো</button>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <header>
      <h2>রিয়েলটাইম চ্যাট</h2>
      <div id="online-count">অনলাইন: 0</div>
    </header>

    <div class="main">
      <aside id="users-panel">
        <h3>অনলাইন ইউজার</h3>
        <ul id="user-list"></ul>
      </aside>

      <section class="chat-area">
        <div id="messages"></div>
        <form id="message-form">
          <input type="text" id="message-input" placeholder="মেসেজ লিখো..." autocomplete="off" maxlength="500" />
          <button type="submit">পাঠাও</button>
        </form>
      </section>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
