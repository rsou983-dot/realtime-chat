<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রিয়েলটাইম চ্যাট</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
  .hidden { display: none !important; }
  #login-screen { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; text-align: center; }
  #chat-screen { max-width: 700px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; }
  input { padding: 10px; width: 80%; margin: 5px; }
  button { padding: 10px 20px; cursor: pointer; }
  #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
  #message-form { display: flex; gap: 5px; }
  #message-form input { flex: 1; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>চ্যাটে প্রবেশ করো</h2>
  <input id="username-input" placeholder="তোমার নাম লিখো">
  <br>
  <button id="join-btn" type="button">প্রবেশ করো</button>
</div>

<div id="chat-screen" class="hidden">
  <h3>রিয়েলটাইম চ্যাট <span id="online-count">অনলাইন: 0</span></h3>
  <div id="messages"></div>
  <form id="message-form">
    <input id="message-input" placeholder="মেসেজ লিখো...">
    <button type="submit">পাঠাও</button>
  </form>
  <h4>অনলাইন ইউজার</h4>
  <ul id="user-list"></ul>
</div>

<script src="https://realtime-chat-uijw.onrender.com/socket.io/socket.io.js"></script>
<script>
let socket = null;
try { socket = io('https://realtime-chat-uijw.onrender.com'); } catch(e) {}

const loginScreen = document.getElementById('login-screen');
const chatScreen = document.getElementById('chat-screen');
const usernameInput = document.getElementById('username-input');
const joinBtn = document.getElementById('join-btn');
const messagesDiv = document.getElementById('messages');
const messageForm = document.getElementById('message-form');
const messageInput = document.getElementById('message-input');
const userList = document.getElementById('user-list');
const onlineCount = document.getElementById('online-count');

joinBtn.addEventListener('click', () => {
  const name = usernameInput.value.trim();
  if (!name) return alert('নাম লিখো');
  if (socket) socket.emit('join', name);
  loginScreen.classList.add('hidden');
  chatScreen.classList.remove('hidden');
});

messageForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (!text) return;
  if (socket) socket.emit('chatMessage', text);
  messageInput.value = '';
});

function addMessage(data) {
  let name = 'Unknown', text = '';
  if (typeof data === 'string') text = data;
  else if (data) {
    name = data.username || data.user || data.name || name;
    text = data.message || data.text || data.msg || '';
  }
  if (!text) return;
  const div = document.createElement('div');
  div.innerHTML = '<b></b>: <span></span>';
  div.querySelector('b').textContent = name;
  div.querySelector('span').textContent = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function updateUsers(list) {
  if (!Array.isArray(list)) return;
  userList.innerHTML = '';
  list.forEach(u => {
    const name = typeof u === 'string' ? u : (u.username || u.name || '');
    if (!name) return;
    const li = document.createElement('li');
    li.textContent = name;
    userList.appendChild(li);
  });
  onlineCount.textContent = 'অনলাইন: ' + list.length;
}

if (socket) {
  socket.on('message', addMessage);
  socket.on('chatMessage', addMessage);
  socket.on('newMessage', addMessage);
  socket.on('userList', updateUsers);
  socket.on('updateUsers', updateUsers);
}
</script>
</body>
</html>
